<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gentle Start</title>
<meta name="description" content="A gentle daily planner: one next step, never overdue.">
<meta name="theme-color" content="#F3F8F8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gentle Start">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Lora:ital,wght@0,500;0,600;1,500&family=Literata:opsz,wght@7..72,400..600&family=Fraunces:opsz,wght@9..144,400..700&family=DM+Serif+Display&family=Spectral:wght@500;600&family=Shippori+Mincho:wght@500;600&family=Nunito:wght@400;600;700&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Sections"><div id="tabs"></div></nav>
<div id="sheetRoot"></div>
<div id="chatRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="outzone" id="outzone" data-drop-out="1" hidden>Drop here to take it out of its stack</div>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){
    var had=!!navigator.serviceWorker.controller,reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',function(){if(had&&!reloaded){reloaded=true;location.reload()}});
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(r){
      document.addEventListener('visibilitychange',function(){if(!document.hidden)r.update().catch(function(){})});
      r.update().catch(function(){});
    }).catch(function(){});
  });
}
</script>
</body>
</html>
